<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anime Rumble — Speelmappen</title>
  <link rel="stylesheet" href="maps.css">
  <link rel="icon" type="image/png" href="../img/anime-rumble-logo.png">
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script defer src="gamakichi.js"></script>
  <script defer src="frog-sages.js"></script>
  <script defer src="maps.js"></script>
  <script defer src="battlefield.js"></script>
</head>
<body class="maps-page">
  <main class="maps-container">
    <a class="maps-link" href="../../game.html">← Terug naar het spel</a>
    <header class="maps-header"><h1>Kies je arena</h1></header>
    <nav class="maps-picker" aria-label="Door arena’s bladeren" hidden>
      <button type="button" id="maps-previous" aria-label="Vorige arena">←</button>
      <select id="maps-picker" aria-label="Arena"></select>
      <button type="button" id="maps-next" aria-label="Volgende arena">→</button>
    </nav>
    <section id="maps-gallery" class="maps-gallery" aria-label="Speelbare anime-maps">
      <noscript>Schakel JavaScript in om de maps te bekijken en te spelen.</noscript>
    </section>
  </main>
</body>
</html>
