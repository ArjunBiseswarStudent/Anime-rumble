<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08091c">
  <title>Anime Rumble — Press Start</title>
  <link rel="icon" type="image/png" href="assest/img/anime-rumble-logo.png">
  <link rel="stylesheet" href="css/start-screen.css">
  <script defer src="javascript/start-screen.js"></script>
</head>
<body>
  <main class="start-screen" aria-label="Anime Rumble startpagina">
    <div class="ambient ambient-blue" aria-hidden="true"></div>
    <div class="ambient ambient-pink" aria-hidden="true"></div>
    <div class="artboard" id="start-artboard">
      <img id="start-artwork" class="start-artwork" alt="" aria-hidden="true" data-src="assest/img/anime-rumble-start.png">
      <div class="start-fallback">
        <img src="assest/img/anime-rumble-logo.png" alt="Anime Rumble" width="320" height="320">
        <h1>Anime <span>Rumble</span></h1><p>The ultimate anime showdown</p>
      </div>
      <div class="energy-orb" aria-hidden="true"><i></i><i></i></div>
      <svg class="energy-arcs" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
        <path class="arc-blue" d="M48 450 120 360 95 295 205 250 175 190 315 150 M570 0 620 85 605 120 675 185 650 230 M1000 0 970 60 1010 100 970 155"/>
        <path class="arc-pink" d="M1672 120 1540 185 1560 220 1465 250 1510 300 1410 365 M1290 0 1220 90 1260 130 1200 185 M1672 590 1590 545 1610 495 1530 470"/>
      </svg>
      <div id="start-petals" class="petals" aria-hidden="true"></div>
      <a id="press-start" class="press-start" href="game.html" aria-label="Start Anime Rumble en kies je vechters"><span>PRESS START</span></a>
    </div>
    <footer class="start-footer"><span>Klik op start of druk op Enter</span><button id="start-motion-toggle" type="button" aria-pressed="true">Animaties aan</button></footer>
  </main>
</body>
</html>
